<!DOCTYPE html>
<html class="light" lang="en">

<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Manajemen Kamar &amp; Cabang - Pilar Pandawa</title>

<!-- Tailwind wajib dimuat lebih dulu: berkas di bawahnya mengisi konfigurasinya -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<!-- Palet, ukuran huruf, ikon tab, dan gaya dasar bersama seluruh halaman -->
<script src="../js/head-bersama.js"></script>
</head>

<body class="bg-surface-soft text-ink-primary font-body-md antialiased min-h-screen overflow-x-hidden">
        <!-- Memuat Top Nav dari file terpisah -->
        <div id="top-nav-placeholder"></div>
        <script>
                fetch('top-nav.html')
                        .then(response => response.text())
                        .then(data => {
                                const placeholder = document.getElementById('top-nav-placeholder');
                                placeholder.innerHTML = data;
                                placeholder.querySelectorAll('script').forEach(function (oldScript) {
                                        const newScript = document.createElement('script');
                                        if (oldScript.src) {
                                                newScript.src = oldScript.src;
                                        } else {
                                                newScript.textContent = oldScript.textContent;
                                        }
                                        oldScript.replaceWith(newScript);
                                });
                        });
        </script>
        <!-- Main Content Area -->
        <!-- Wadah isi. Jarak kiri, jarak atas, dan latar diatur <main> di dalamnya -->
<div class="flex flex-col">
                <!-- Main Scrollable Canvas -->
                <main class="md:ml-[260px] pt-[96px] px-base md:px-lg lg:px-xl pb-xl min-h-screen flex flex-col gap-lg">
                        <div class="flex flex-col gap-lg" id="branchesListView">
                                <div class="flex flex-col md:flex-row md:items-center justify-between gap-base">
                                        <div>
                                                <h1 class="font-display-lg text-display-lg font-bold text-ink-primary tracking-tight">Manajemen
                                                        Kamar &amp; Cabang</h1>
                                                <div class="flex flex-wrap gap-md mt-sm">
                                                        <div
                                                                class="flex items-center gap-xs text-body-sm text-ink-muted">
                                                                <span
                                                                        class="material-symbols-outlined text-[18px]">apartment</span>
                                                                <span id="statTotalCabang">Memuat...</span>
                                                        </div>
                                                        <div
                                                                class="flex items-center gap-xs text-body-sm text-status-available">
                                                                <span
                                                                        class="material-symbols-outlined text-[18px]">door_open</span>
                                                                <span id="statKamarTersedia">-</span>
                                                        </div>
                                                        <div
                                                                class="flex items-center gap-xs text-body-sm text-status-occupied">
                                                                <span
                                                                        class="material-symbols-outlined text-[18px]">bed</span>
                                                                <span id="statKamarTerisi">-</span>
                                                        </div>
                                                </div>
                                        </div>
                                </div>
                                <div class="flex flex-col lg:flex-row gap-lg items-start">
                                        <!-- Left Column: Branch Selector -->
                                        <aside class="w-full lg:w-72 flex flex-col gap-sm">
                                                <div
                                                        class="text-label-md font-bold text-ink-muted uppercase tracking-wider px-sm">
                                                        Pilih Cabang</div>
                                                <div class="flex flex-col gap-2" id="branchList"></div>
                                        </aside>
                                        <!-- Right Column: Branch Details -->
                                        <div class="flex-1 flex flex-col gap-lg w-full">
                                                <div
                                                        class="bg-surface-canvas rounded-xl p-lg shadow-sm border border-border-hairline">
                                                        <div
                                                                class="flex flex-col md:flex-row justify-between items-start md:items-center gap-base mb-lg">
                                                                <div>
                                                                        <h2 id="branchDetailName"
                                                                                class="font-display-md text-display-md text-ink-primary">Memuat...</h2>
                                                                        <p id="branchDetailAddress" class="text-ink-muted text-body-sm"></p>
                                                                </div>
                                                                <div class="flex gap-sm">
                                                                        <!-- <button id="editBranchInfoBtn"
                                                                                class="px-base py-2 border border-border-strong text-ink-primary font-button-md rounded-lg hover:bg-surface-soft transition-colors">Edit
                                                                                Info Cabang</button>
                                                                        <button id="openAddRoomBtn"
                                                                                class="px-base py-sm bg-primary text-on-primary font-button-md rounded-lg hover:opacity-90 transition-colors flex items-center gap-xs shadow-sm">
                                                                                <span
                                                                                        class="material-symbols-outlined">add</span>
                                                                                Tambah Kamar
                                                                        </button> -->
                                                                </div>
                                                        </div>
                                                        <div class="flex flex-col md:flex-row gap-md items-center">
                                                                <div class="relative flex-1 w-full">
                                                                        <input id="searchRoom" class="w-full h-[44px] bg-surface-soft border border-border-hairline rounded-xl shadow-sm pl-10 pr-base text-body-sm focus:ring-primary"
                                                                                placeholder="Cari nomor kamar..."
                                                                                type="text">
                                                                        <span
                                                                                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-ink-muted">search</span>
                                                                </div>
                                                                <select id="filterStatusKamar"
                                                                        class="w-full md:w-48 h-[44px] bg-surface-soft border border-border-hairline rounded-xl shadow-sm px-base text-body-sm focus:ring-primary">
                                                                        <option value="semua">Semua Status</option>
                                                                        <option value="tersedia">Tersedia</option>
                                                                        <option value="terisi">Terisi</option>
                                                                        <!-- <option>Maintenance</option> -->
                                                                </select>
                                                        </div>
                                                </div>
                                                <!-- Room Grid -->
                                                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-base" id="roomGrid"></div>
                                        </div>
                                </div>
                        </div>
                        <!-- Page: Tambah Kamar Baru (Hidden by default) -->
                        <div class="hidden flex-col bg-surface-canvas rounded-xl shadow-sm border border-border-hairline min-h-[calc(100vh-160px)]"
                                id="addRoomPage">
                                <div
                                        class="px-lg py-base border-b border-border-hairline flex justify-between items-center">
                                        <h3 class="font-display-md text-display-md text-ink-primary">Tambah Kamar Baru
                                        </h3>
                                        <button class="text-ink-muted hover:bg-surface-variant transition-colors p-sm rounded-full px-sm py-xxs font-badge text-badge inline-flex items-center gap-xxs"
                                                id="closeAddRoomBtn">
                                                <span class="material-symbols-outlined">close</span>
                                        </button>
                                </div>
                                <div class="p-lg overflow-y-auto flex-1">
                                        <form class="flex flex-col gap-lg" id="addRoomForm">
                                                <div class="grid grid-cols-1 gap-base">
                                                        <div class="flex flex-col gap-xs">
                                                                <label
                                                                        class="font-label-md text-label-md text-ink-muted">Pilih
                                                                        Cabang</label>
                                                                <select id="addRoomBranchSelect"
                                                                        class="w-full h-[44px] bg-surface-soft border border-border-hairline rounded-xl shadow-sm px-base text-body-sm focus:ring-primary outline-none transition-all">
                                                                </select>
                                                        </div>
                                                        <div class="flex flex-col gap-xs">
                                                                <label
                                                                        class="font-label-md text-label-md text-ink-muted">Nomor/Nama
                                                                        Kamar</label>
                                                                <input class="w-full h-[44px] bg-surface-soft border border-border-hairline rounded-xl shadow-sm px-base text-body-sm focus:ring-primary outline-none transition-all"
                                                                        placeholder="e.g., A-101" type="text">
                                                        </div>
                                                </div>
                                                <!-- <div class="flex flex-col gap-sm border-t border-border-hairline pt-md">
                                                        <label class="font-label-md text-label-md text-ink-muted">Fasilitas
                                                                Kamar</label>
                                                        <div class="grid grid-cols-2 md:grid-cols-3 gap-sm">
                                                                <label class="flex items-center gap-sm">
                                                                        <input class="text-primary focus:ring-primary rounded"
                                                                                type="checkbox">
                                                                        <span class="font-body-sm text-body-sm">AC</span>
                                                                </label>
                                                                <label class="flex items-center gap-sm">
                                                                        <input class="text-primary focus:ring-primary rounded"
                                                                                type="checkbox">
                                                                        <span class="font-body-sm text-body-sm">Kamar Mandi
                                                                                Dalam</span>
                                                                </label>
                                                                <label class="flex items-center gap-sm">
                                                                        <input class="text-primary focus:ring-primary rounded"
                                                                                type="checkbox">
                                                                        <span class="font-body-sm text-body-sm">TV</span>
                                                                </label>
                                                                <label class="flex items-center gap-sm">
                                                                        <input class="text-primary focus:ring-primary rounded"
                                                                                type="checkbox">
                                                                        <span class="font-body-sm text-body-sm">Water
                                                                                Heater</span>
                                                                </label>
                                                                <label class="flex items-center gap-sm">
                                                                        <input class="text-primary focus:ring-primary rounded"
                                                                                type="checkbox">
                                                                        <span class="font-body-sm text-body-sm">Kulkas
                                                                                Mini</span>
                                                                </label>
                                                        </div>
                                                </div> -->
                                        </form>
                                </div>
                                <div
                                        class="px-lg py-base border-t border-border-hairline bg-surface-soft flex justify-end gap-sm rounded-b-2xl">
                                        <button class="px-base py-2 border border-outline-variant text-primary font-button-md bg-surface-canvas rounded-lg hover:bg-surface-soft transition-colors shadow-sm"
                                                id="cancelAddRoomBtn">Batal</button>
                                        <button class="px-base py-sm bg-primary text-on-primary font-button-md rounded-lg hover:opacity-90 transition-colors shadow-sm"
                                                id="saveAddRoomBtn">Simpan
                                                Data Kamar</button>
                                </div>
                        </div>
                        <!-- Page: Tambah Cabang Baru (Hidden by default) -->
                        <div class="hidden flex-col bg-surface-canvas rounded-xl shadow-sm border border-border-hairline min-h-[calc(100vh-160px)]"
                                id="addBranchPage">
                                <div
                                        class="px-lg py-base border-b border-border-hairline flex justify-between items-center">
                                        <h3 class="font-display-md text-display-md text-ink-primary" id="addBranchPageTitle">Tambah Cabang Baru
                                        </h3>
                                        <button class="text-ink-muted hover:bg-surface-variant transition-colors p-sm rounded-full px-sm py-xxs font-badge text-badge inline-flex items-center gap-xxs"
                                                id="closeAddBranchBtn">
                                                <span class="material-symbols-outlined">close</span>
                                        </button>
                                </div>
                                <div class="p-lg overflow-y-auto flex-1">
                                        <form class="flex flex-col gap-lg" id="addBranchForm">
                                                <div class="grid grid-cols-1 gap-base">
                                                        <div class="flex flex-col gap-xs">
                                                                <label
                                                                        class="font-label-md text-label-md text-ink-muted">Nama
                                                                        Cabang</label>
                                                                <input class="w-full h-[44px] bg-surface-soft border border-border-hairline rounded-xl shadow-sm px-base text-body-sm focus:ring-primary outline-none transition-all"
                                                                        placeholder="e.g., Pesona Kos" type="text" id="branchNameInput">
                                                        </div>
                                                        <div class="flex flex-col gap-xs">
                                                                <label
                                                                        class="font-label-md text-label-md text-ink-muted">Alamat</label>
                                                                <textarea class="w-full bg-surface-soft border border-border-hairline rounded-xl shadow-sm px-base py-sm text-body-sm focus:ring-primary outline-none transition-all resize-none"
                                                                        placeholder="Jl. Melati No. 45, Jakarta Selatan" rows="3" id="branchAddressInput"></textarea>
                                                        </div>
                                                        <div class="flex flex-col gap-xs">
                                                                <label
                                                                        class="font-label-md text-label-md text-ink-muted">URL
                                                                        Google Maps</label>
                                                                <input class="w-full h-[44px] bg-surface-soft border border-border-hairline rounded-xl shadow-sm px-base text-body-sm focus:ring-primary outline-none transition-all"
                                                                        placeholder="https://maps.google.com/..." type="url" id="branchMapsUrlInput">
                                                        </div>
                                                </div>
                                                <div class="flex flex-col gap-sm border-t border-border-hairline pt-md">
                                                        <label class="font-label-md text-label-md text-ink-muted">Fasilitas
                                                                Cabang</label>
                                                        <div class="grid grid-cols-2 md:grid-cols-3 gap-sm" id="branchFacilitiesGroup">
                                                                <label class="flex items-center gap-sm">
                                                                        <input class="text-primary focus:ring-primary rounded"
                                                                                type="checkbox" data-facility="WiFi">
                                                                        <span class="font-body-sm text-body-sm">WiFi</span>
                                                                </label>
                                                                <label class="flex items-center gap-sm">
                                                                        <input class="text-primary focus:ring-primary rounded"
                                                                                type="checkbox" data-facility="Parkir Kendaraan">
                                                                        <span class="font-body-sm text-body-sm">Parkir
                                                                                Kendaraan</span>
                                                                </label>
                                                                <label class="flex items-center gap-sm">
                                                                        <input class="text-primary focus:ring-primary rounded"
                                                                                type="checkbox" data-facility="CCTV 24 Jam">
                                                                        <span class="font-body-sm text-body-sm">CCTV 24
                                                                                Jam</span>
                                                                </label>
                                                                <label class="flex items-center gap-sm">
                                                                        <input class="text-primary focus:ring-primary rounded"
                                                                                type="checkbox" data-facility="Dapur Bersama">
                                                                        <span class="font-body-sm text-body-sm">Dapur
                                                                                Bersama</span>
                                                                </label>
                                                                <label class="flex items-center gap-sm">
                                                                        <input class="text-primary focus:ring-primary rounded"
                                                                                type="checkbox" data-facility="Laundry">
                                                                        <span class="font-body-sm text-body-sm">Laundry</span>
                                                                </label>
                                                                <label class="flex items-center gap-sm">
                                                                        <input class="text-primary focus:ring-primary rounded"
                                                                                type="checkbox" data-facility="Keamanan Malam">
                                                                        <span class="font-body-sm text-body-sm">Keamanan
                                                                                Malam</span>
                                                                </label>
                                                        </div>
                                                </div>
                                        </form>
                                </div>
                                <div
                                        class="px-lg py-base border-t border-border-hairline bg-surface-soft flex justify-end gap-sm rounded-b-2xl">
                                        <button class="px-base py-2 border border-outline-variant text-primary font-button-md bg-surface-canvas rounded-lg hover:bg-surface-soft transition-colors shadow-sm"
                                                id="cancelAddBranchBtn">Batal</button>
                                        <button class="px-base py-sm bg-primary text-on-primary font-button-md rounded-lg hover:opacity-90 transition-colors shadow-sm"
                                                id="saveAddBranchBtn">Simpan
                                                Data Cabang</button>
                                </div>
                        </div>
                </main>
        </div>

        <!-- Menyambungkan halaman ini ke data Firestore -->
        <script type="module" src="../js/admin-branches.js"></script>

</body>

</html>
