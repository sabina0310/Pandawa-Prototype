<body class="bg-background text-on-background min-h-screen">
        <!-- Memuat Top Nav dari file terpisah -->
        <div id="top-nav-placeholder"></div>
        <script>
                fetch('top-nav.html')
                        .then(response => response.text())
                        .then(data => {
                                const placeholder = document.getElementById('top-nav-placeholder');
                                placeholder.innerHTML = data;
                                placeholder.querySelectorAll('script').forEach(function (oldScript) {
                                        const newScript = document.createElement('script');
                                        if (oldScript.src) {
                                                newScript.src = oldScript.src;
                                        } else {
                                                newScript.textContent = oldScript.textContent;
                                        }
                                        oldScript.replaceWith(newScript);
                                });
                        });
        </script>
        <!-- Main Content -->
        <main class="pt-[96px] md:ml-[260px] px-base md:px-xl pb-xl min-h-screen">
                <div class="max-w-5xl mx-auto space-y-lg">
                        <!-- Page Header -->
                        <div class="mb-lg">

                                <h1 class="font-display-xl text-[24px] text-ink-primary mb-xs font-bold tracking-tight">
                                        <!-- <a href="javascript:history.back()"
                                                class="flex items-center justify-center p-2 mt-0.5 rounded-full hover:bg-surface-variant text-ink-secondary transition-colors cursor-pointer"
                                                title="Kembali ke halaman sebelumnya">
                                                <span class="material-symbols-outlined text-[24px]">arrow_back</span>
                                        </a> -->
                                        <span id="pageTitle">Memuat data...</span>
                                </h1>
                                <p class="font-body-sm text-[14px] text-ink-muted">Tentukan kamar fisik untuk transaksi
                                        pemesanan yang telah dikonfirmasi.</p>
                        </div>
                        <!-- Summary Card -->
                        <div
                                class="bg-surface-canvas rounded-[16px] p-base md:p-lg shadow-card border border-border-hairline flex flex-col md:flex-row gap-lg md:items-center justify-between">
                                <div class="flex items-start gap-md">
                                        <div
                                                class="h-14 w-14 rounded-full bg-surface-soft flex items-center justify-center text-ink-primary font-display-md text-display-md"
                                                id="summaryInitials">-</div>
                                        <div>
                                                <div class="flex items-center gap-sm mb-xs">
                                                        <h2
                                                                class="font-display-md text-[18px] text-ink-primary font-bold" id="summaryName">-</h2>
                                                        <span
                                                                class="bg-[#ECFDF3] text-status-available px-[10px] py-[2px] rounded-full font-badge text-[10px] uppercase font-bold border border-[#10b981]/20"
                                                                id="summaryStatus">-</span>
                                                </div>
                                                <p
                                                        class="font-body-sm text-body-sm text-ink-muted flex items-center gap-xs">
                                                        <span class="material-symbols-outlined text-[16px] text-whatsapp-green"
                                                                style="font-variation-settings: 'FILL' 1;">chat</span>
                                                        <span id="summaryContact">-</span>
                                                </p>
                                        </div>
                                </div>
                                <div
                                        class="grid grid-cols-2 md:grid-cols-3 gap-md md:gap-xl border-t md:border-t-0 md:border-l border-border-hairline pt-md md:pt-0 md:pl-lg">
                                        <div>
                                                <p
                                                        class="font-tag-uppercase text-[10px] font-bold tracking-wider text-ink-muted mb-xs uppercase">
                                                        Cabang</p>
                                                <p class="font-body-sm text-body-sm text-ink-primary font-medium" id="summaryBranch">-</p>
                                        </div>
                                        <div>
                                                <p
                                                        class="font-tag-uppercase text-[10px] font-bold tracking-wider text-ink-muted mb-xs uppercase">
                                                        Tipe</p>
                                                <span
                                                        class="bg-surface-soft text-ink-secondary px-[10px] py-[2px] rounded-md font-badge text-[10px] uppercase font-bold tracking-wide"
                                                        id="summaryType">-</span>
                                        </div>
                                        <div class="col-span-2 md:col-span-1">
                                                <p
                                                        class="font-tag-uppercase text-[10px] font-bold tracking-wider text-ink-muted mb-xs uppercase">
                                                        Periode</p>
                                                <p class="font-body-sm text-body-sm text-ink-primary font-medium" id="summaryPeriod">-</p>
                                        </div>
                                </div>
                        </div>
                        <!-- Room Selection Section -->
                        <div
                                class="bg-surface-canvas rounded-[16px] p-base md:p-lg shadow-card border border-border-hairline">
                                <div
                                        class="flex flex-col md:flex-row justify-between items-start md:items-center mb-lg gap-sm">
                                        <h3 class="font-display-md text-[18px] font-bold text-ink-primary" id="roomGridTitle">Pilih Kamar</h3>
                                        <!-- Legend -->
                                        <div class="flex flex-wrap gap-md font-body-sm text-[13px] text-ink-secondary">
                                                <div class="flex items-center gap-xs">
                                                        <div class="w-3 h-3 rounded-full bg-status-available"></div>
                                                        Tersedia
                                                </div>
                                                <div class="flex items-center gap-xs">
                                                        <div class="w-3 h-3 rounded-full bg-primary"></div>Dipilih
                                                </div>
                                                <div class="flex items-center gap-xs">
                                                        <div class="w-3 h-3 rounded-full bg-status-occupied"></div>
                                                        Terisi
                                                </div>
                                                <div class="flex items-center gap-xs">
                                                        <div class="w-3 h-3 rounded-full bg-status-warning"></div>Akan
                                                        Check-out
                                                </div>
                                        </div>
                                </div>
                                <!-- Grid -->
                                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-md" id="roomGrid"></div>
                        </div>
                        <!-- Form Area -->
                        <div
                                class="bg-surface-canvas rounded-[16px] p-base md:p-lg shadow-card border border-border-hairline space-y-md">
                                <div>
                                        <label class="block font-body-sm text-[13px] text-ink-muted mb-xs">Kamar
                                                Terpilih</label>
                                        <input class="w-full px-md py-sm rounded-lg border border-border-hairline bg-surface-soft text-ink-primary font-body-sm text-body-sm focus:outline-none focus:ring-0 cursor-default"
                                                id="selectedRoomInput" readonly="" type="text"
                                                placeholder="Belum ada kamar dipilih" value="">
                                </div>
                                <div>
                                        <label class="block font-body-sm text-[13px] text-ink-muted mb-xs">Catatan Serah
                                                Terima (Opsional)</label>
                                        <textarea
                                                class="w-full px-md py-sm rounded-lg border border-border-hairline focus:border-primary focus:ring-1 focus:ring-primary bg-surface-canvas text-ink-primary font-body-sm text-body-sm transition-all resize-none outline-none"
                                                placeholder="Contoh: Kunci fisik sudah disiapkan di resepsionis"
                                                rows="3"></textarea>
                                </div>
                        </div>
                        <!-- Actions -->
                        <div class="flex flex-col-reverse sm:flex-row justify-end gap-md pt-sm pb-section">
                                <button id="cancelBtn"
                                        class="px-xl py-sm rounded-lg border border-primary text-primary font-button-md text-button-md hover:bg-primary-fixed/10 transition-colors bg-white disabled:opacity-60">
                                        Batal
                                </button>
                                <button class="px-xl py-sm rounded-lg bg-primary text-white font-button-md text-button-md hover:opacity-90 shadow-sm transition-opacity flex items-center justify-center gap-xs disabled:opacity-60 disabled:cursor-not-allowed"
                                        id="confirmSaveBtn">
                                        <span class="material-symbols-outlined text-[18px]"
                                                style="font-variation-settings: 'FILL' 1;">save</span>
                                        Konfirmasi &amp; Simpan Alokasi
                                </button>
                        </div>
                </div>
        </main>

        <!-- Menyambungkan halaman ini ke data Firestore -->
        <script type="module" src="../js/admin-alokasi-kamar.js"></script>

</body>
