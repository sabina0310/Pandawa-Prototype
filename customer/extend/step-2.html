<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Perpanjangan Sewa - Pembayaran - Pilar Pandawa</title>

    <!-- Tailwind wajib dimuat lebih dulu: berkas di bawahnya mengisi konfigurasinya -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Palet, ukuran huruf, ikon tab, dan gaya dasar bersama seluruh halaman customer -->
    <script src="../../js/head-bersama.js"></script>
</head>

<body class="bg-background text-ink-primary font-body-md antialiased min-h-screen flex flex-col">
    <header
        class="bg-surface-canvas border-b border-border-hairline px-base lg:px-xl h-16 flex items-center justify-between sticky top-0 z-40 shadow-sm">
        <div class="flex-1 flex items-center justify-start">
            <a href="step-1.html"
                class="flex items-center gap-sm cursor-pointer hover:opacity-80 transition-opacity">
                <span class="material-symbols-outlined text-primary text-[24px]">arrow_back</span>
                <span class="font-button-md text-button-md text-primary">Kembali</span>
            </a>
        </div>
        <div class="flex-1 flex items-center justify-center">
            <div class="font-display-md text-display-md text-primary tracking-tight">
                Pilar Pandawa
            </div>
        </div>
        <div class="flex-1 flex items-center justify-end">
            <button
                class="text-ink-secondary hover:text-primary p-sm rounded-full hover:bg-surface-soft transition-colors belum-tersedia"
                aria-disabled="true" title="Halaman ini belum tersedia">
                <span class="material-symbols-outlined">help_outline</span>
            </button>
        </div>
    </header>
    <main class="flex-1 w-full max-w-7xl mx-auto px-base lg:px-xl py-lg lg:py-xl">
        <!-- Stepper -->
        <div class="w-full max-w-2xl mx-auto mb-xl">
            <div class="flex items-center justify-between relative">
                <div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-[2px] bg-surface-variant z-0"></div>
                <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/2 h-[2px] bg-primary z-0"></div>
                <!-- Step 1 -->
                <div class="relative z-10 flex flex-col items-center gap-sm bg-background px-xs">
                    <div
                        class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold font-title-md">
                        <span class="material-symbols-outlined text-sm">check</span>
                    </div><span class="font-label-md text-label-md font-bold text-primary">Metode Pembayaran</span>
                </div>
                <!-- Step 2 (Active) -->
                <div class="relative z-10 flex flex-col items-center gap-sm bg-background px-xs">
                    <div
                        class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold font-title-md">
                        2</div>
                    <span class="font-label-md text-label-md font-bold text-primary">Pembayaran</span>
                </div>
                <!-- Step 3 (Upcoming) -->
                <div class="relative z-10 flex flex-col items-center gap-sm bg-background px-xs">
                    <div
                        class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-title-md">
                        3</div>
                    <span class="font-label-md text-label-md text-on-surface-variant">Konfirmasi</span>
                </div>
            </div>
        </div>
        <div class="flex flex-col lg:flex-row gap-lg">
            <!-- Payment Module -->
            <div class="w-full flex flex-col gap-lg">
                <!-- Countdown Alert -->
                <div
                    class="bg-error-container/20 border border-error-container rounded-lg p-md flex items-start gap-md">
                    <span class="material-symbols-outlined text-error mt-xs">timer</span>
                    <div class="flex-grow flex flex-col sm:flex-row sm:items-center justify-between gap-sm">
                        <p class="font-body-md text-body-md text-on-surface">Selesaikan Pembayaran Sebelum</p>
                        <p class="font-display-md text-display-md text-error" id="countdown-timer">23:59:50</p>
                    </div>
                </div>
                <!-- Kartu pembayaran: diisi js/pembayaran.js sesuai metode terpilih -->
                <div id="kartuPembayaran"></div>
                <!-- Langkah pembayaran: diisi js/pembayaran.js sesuai metode terpilih -->
                <div id="caraPembayaran"></div>
            </div>
        </div>
    </main>

    <!-- Payment Success Modal -->
    <div class="fixed inset-0 bg-ink-primary/50 backdrop-blur-sm z-50 hidden items-center justify-center p-base"
        id="paymentSuccessModal">
        <div class="bg-surface-canvas rounded-xl shadow-lg w-full max-w-md overflow-hidden flex flex-col">
            <div class="h-24 bg-primary relative flex items-center justify-center">
                <div
                    class="absolute -bottom-6 w-12 h-12 rounded-full bg-surface-canvas flex items-center justify-center shadow-sm">
                    <span class="material-symbols-outlined text-status-available text-[32px]">check_circle</span>
                </div>
            </div>
            <div class="p-lg pt-8 flex flex-col items-center text-center gap-md">
                <div class="flex flex-col gap-xs">
                    <h3 class="font-display-md text-display-md text-ink-primary">Pembayaran Berhasil!</h3>
                    <p class="font-body-md text-body-md text-ink-secondary">Pembayaran perpanjangan sewa Anda telah kami
                        terima. Silakan lanjut untuk melihat ringkasan pesanan perpanjangan.</p>
                </div>
                <p class="font-body-sm text-[12px] text-ink-muted text-center" id="statusSimpanDatabase"></p>
                <button id="goToStep3Btn"
                    class="w-full bg-primary text-on-primary font-button-md text-button-md py-md rounded-lg hover:opacity-90 transition-colors shadow-sm mt-sm">
                    Lihat Ringkasan Pesanan
                </button>
            </div>
        </div>
    </div>

    <!-- Pustaka pembuat QR (cadangan bila Midtrans hanya mengirim qr_string) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

    <!-- Halaman pembayaran: kode QR / nomor Virtual Account, pengecekan status,
     dan pencatatan perpanjangan ke Firestore setelah pembayaran lunas -->
    <script type="module" src="../../js/extend-step2.js"></script>

</body>

</html>
