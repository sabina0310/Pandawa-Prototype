<div class="max-w-[400px] mx-auto w-full">
<!-- Header -->

<!-- Form -->
<!-- Kotak pesan hasil aksi (sukses / gagal) -->
<div class="hidden" id="authAlert"></div>
<form class="space-y-lg" id="loginForm">
<!-- Username Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-ink-primary font-semibold" for="username">Username</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 flex items-center pl-md pointer-events-none text-ink-muted">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="w-full pl-xl pr-md py-md bg-surface border-border-strong border rounded-lg focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all font-body-md text-ink-primary" id="username" placeholder="Masukkan username" required="" type="text">
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-ink-primary font-semibold" for="password">Kata Sandi</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 flex items-center pl-md pointer-events-none text-ink-muted">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full pl-xl pr-[48px] py-md bg-surface border-border-strong border rounded-lg focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all font-body-md text-ink-primary" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 flex items-center pr-md text-on-surface-variant hover:text-primary-container transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
<div class="flex justify-end pt-xs">
<a class="font-label-md text-label-md text-primary-container hover:underline font-semibold belum-tersedia" href="#" aria-disabled="true" title="Halaman ini belum tersedia">Lupa Kata Sandi?</a>
</div>
</div>
<!-- Primary Action -->
<button id="loginBtn" class="w-full py-md px-base bg-primary-container text-on-primary font-button-md text-button-md rounded-lg shadow-md hover:shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex justify-center items-center gap-sm mt-lg" type="submit">
                    Masuk
                </button>
</form>
<!-- Divider -->
<div class="relative my-xl">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-border-hairline"></div>
</div>
<div class="relative flex justify-center text-body-sm font-body-sm">
<span class="px-md bg-surface-canvas text-ink-muted">Atau Konsultasi Langsung</span>
</div>
</div>
<!-- Secondary Action (WhatsApp) -->
<div class="space-y-xl">
<a class="w-full py-md px-base bg-whatsapp-green text-on-secondary font-button-md text-button-md rounded-lg shadow-sm hover:bg-whatsapp-hover hover:shadow-md active:scale-[0.98] transition-all flex justify-center items-center gap-sm" href="https://wa.me/6281234567890" target="_blank">

</svg>
                    Hubungi Petugas via WhatsApp

<!-- Footer Link -->
<p class="text-center font-body-sm text-body-sm text-ink-muted">
                    Belum punya akun? <a class="text-primary-container font-semibold hover:underline" href="register-customer.html">Daftar di sini</a>
</p>
</div>
</div>
</section>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        // Add subtle animation when focus state changes
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.005]');
                input.parentElement.style.transition = 'all 0.2s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.005]');
            });
        });
    </script>
