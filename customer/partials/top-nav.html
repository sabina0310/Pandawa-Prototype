<!--
    Top nav bersama halaman customer.

    Dipakai oleh index.html, customer/catalogue.html, dan
    customer/room-detail.html melalui js/customer-topnav.js.

    Seluruh href di bawah sengaja dibiarkan "#": alamatnya diisi
    js/customer-topnav.js karena berkas ini dipakai dari dua tingkat
    folder yang berbeda, sehingga tautan relatifnya tidak bisa sama.

    Menu di layar kecil memakai ELEMEN YANG SAMA dengan layar lebar,
    hanya ditata ulang lewat kelas Tailwind. Dengan begitu tidak ada
    tautan yang terduplikasi, dan tombol "menu" yang dulu diam kini
    benar-benar membuka daftar tautan (lihat js/komponen.js).
-->

            <span class="material-symbols-outlined text-primary-container text-display-md" data-weight="fill"
                style="font-variation-settings: 'FILL' 1;">location_city</span>
            <span class="text-display-md font-display-md text-primary font-bold">Pilar Pandawa</span>
        </a>

        <!-- Tautan: sebaris di layar lebar, panel turun di layar kecil -->
        <div id="navMenu"
            class="hidden md:flex md:static md:w-auto md:flex-row md:items-center md:gap-lg md:border-0 md:bg-transparent md:p-0 md:shadow-none

            <a class="text-primary font-bold md:border-b-2 md:border-primary md:pb-1 md:px-0 rounded-lg px-md py-sm md:rounded-none md:bg-transparent bg-primary-fixed/60 transition-colors"

                <span class="material-symbols-outlined">menu</span>
