<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Room Catalog - Pilar Pandawa</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"

            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>

            theme: {
                extend: {
                    "colors": {
                        "status-occupied": "#ef4444",

                        "inverse-primary": "#b2c5ff",
                        "status-warning": "#f59e0b",
                        "surface-container-lowest": "#ffffff",
                        "status-available": "#10b981",
                        "error-container": "#ffdad6",
                        "surface": "#fcf9f8",
                        "surface-container-high": "#eae7e7",
                        "surface-variant": "#e5e2e1",
                        "on-tertiary-fixed": "#2a1700",
                        "surface-tint": "#0055d5",
                        "secondary-container": "#5dfd8a",
                        "on-primary-fixed": "#001849",
                        "secondary": "#006d2f",
                        "on-primary-container": "#cfd9ff",
                        "outline": "#737686",
                        "primary-container": "#0156d7",
                        "on-surface-variant": "#424654",
                        "surface-soft": "#f7f7f7",
                        "surface-container": "#f0eded",
                        "on-tertiary-container": "#ffd4a2",
                        "primary": "#0040a6",
                        "on-surface": "#1b1c1c",
                        "surface-canvas": "#ffffff",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffddb8",
                        "on-secondary-fixed-variant": "#005322",
                        "primary-fixed-dim": "#b2c5ff",
                        "border-hairline": "#dddddd",
                        "secondary-fixed": "#66ff8e",
                        "inverse-surface": "#303030",
                        "whatsapp-hover": "#1da851",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ffb95f",
                        "ink-secondary": "#3f3f3f",
                        "tertiary-container": "#875500",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f3f0ef",
                        "on-secondary-container": "#007232",
                        "surface-dim": "#dcd9d9",

                        "primary-fixed": "#dae2ff",
                        "on-primary-fixed-variant": "#003fa3",
                        "error": "#ba1a1a",
                        "tertiary": "#674000",
                        "on-secondary-fixed": "#002109",
                        "secondary-fixed-dim": "#3de273"

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"

                    "spacing": {

                        "xl": "32px",
                        "section": "64px",

<body class="bg-surface font-body-md text-ink-primary antialiased">
    <!-- Memuat Top Nav dari file terpisah -->
    <div id="top-nav-placeholder"></div>
    <script>
        fetch('top-nav.html')
            .then(response => response.text())
            .then(data => {
                const placeholder = document.getElementById('top-nav-placeholder');
                placeholder.innerHTML = data;
                placeholder.querySelectorAll('script').forEach(function (oldScript) {
                    const newScript = document.createElement('script');
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    oldScript.replaceWith(newScript);
                });
            });
    </script>
    <main class="max-w-7xl mx-auto px-lg py-section grid grid-cols-1 md:grid-cols-12 gap-lg items-start">
        <!-- Left Column (Sidebar Filter) -->
        <aside
            class="md:col-span-3 bg-surface-canvas rounded-lg shadow-[0_1px_3px_0_rgba(0,0,0,0.1)] p-base sticky top-24">
            <h2 class="font-display-md text-display-md text-ink-primary mb-base">Filter Kamar</h2>
            <div class="flex flex-col gap-base">
                <!-- Branch Dropdown -->
                <div class="flex flex-col gap-xs">
                    <label class="font-label-md text-label-md text-ink-muted">Pilih Cabang</label>
                    <!-- Pilihan cabang diisi otomatis dari Firestore oleh js/catalogue.js -->
                    <select id="filterCabang"
                        class="form-select w-full rounded-md border-strong text-ink-primary font-body-md focus:border-primary focus:ring-1 focus:ring-primary">
                        <option value="semua">Semua Cabang</option>
                    </select>
                </div>
                <!-- Rental Type -->
                <div class="flex flex-col gap-xs">
                    <label class="font-label-md text-label-md text-ink-muted">Tipe Sewa</label>
                    <div class="flex flex-col gap-sm">
                        <label class="inline-flex items-center">
                            <input checked="" class="form-radio text-primary focus:ring-primary" name="rentalType"
                                type="radio" value="Semua">
                            <span class="ml-2 font-body-md text-ink-primary">Semua</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input class="form-radio text-primary focus:ring-primary" name="rentalType" type="radio"
                                value="Harian">
                            <span class="ml-2 font-body-md text-ink-primary">Harian (Pria)</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input class="form-radio text-primary focus:ring-primary" name="rentalType" type="radio"
                                value="Bulanan">
                            <span class="ml-2 font-body-md text-ink-primary">Bulanan (Keluarga)</span>
                        </label>
                    </div>
                </div>
                <!-- Date Pickers -->
                <div class="flex flex-col gap-xs">
                    <label class="font-label-md text-label-md text-ink-muted">Tanggal Mulai</label>
                    <input
                        class="form-input w-full rounded-md border-strong text-ink-primary font-body-md focus:border-primary focus:ring-1 focus:ring-primary"
                        type="date">
                </div>
                <div class="flex flex-col gap-xs">
                    <label class="font-label-md text-label-md text-ink-muted">Tanggal Selesai</label>
                    <input
                        class="form-input w-full rounded-md border-strong text-ink-primary font-body-md focus:border-primary focus:ring-1 focus:ring-primary"
                        type="date">
                </div>
                <!-- Apply Button -->
                <button id="btnTerapkanFilter"
                    class="mt-sm w-full bg-primary-container text-on-primary font-button-md text-button-md py-md rounded-md hover:opacity-90 transition-opacity">
                    Terapkan Filter
                </button>
            </div>
        </aside>
        <!-- Right Column (Catalog Grid) -->
        <section class="md:col-span-9">
            <!-- Keterangan jumlah hasil, diisi oleh js/catalogue.js -->
            <p class="font-body-sm text-body-sm text-ink-muted mb-base" id="infoJumlahKamar">Memuat data kamar...</p>
            <!-- Grid katalog: diisi otomatis dari Firestore oleh js/catalogue.js -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-base" id="katalogGrid">
            </div>
        </section>
    </main>
    <!-- Memuat footer dari file terpisah -->
    <div id="footer-placeholder"></div>
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                const placeholder = document.getElementById('footer-placeholder');
                placeholder.innerHTML = data;
                placeholder.querySelectorAll('script').forEach(function (oldScript) {
                    const newScript = document.createElement('script');
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    oldScript.replaceWith(newScript);
                });
            });
    </script>

    <script>
        (function () {
            const loginNavBtn = document.getElementById('loginNavBtn');
            const profileNavBtn = document.getElementById('profileNavBtn');
            if (localStorage.getItem('customerSession')) {
                loginNavBtn.classList.add('hidden');
                profileNavBtn.classList.remove('hidden');
                profileNavBtn.classList.add('flex');
            }

            // Catatan: klik pada kartu kamar ditangani oleh js/catalogue.js
            // karena kartunya dibuat setelah data Firestore selesai dimuat.
        })();
    </script>

    <!-- Mengambil data katalog dari Firestore -->
    <script type="module" src="../js/catalogue.js"></script>

</body>

</html>
